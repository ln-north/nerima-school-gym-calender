name: Deploy to GitHub Pages

on:
  # mainブランチへのプッシュ時に実行
  push:
    branches:
      - main

  # Pull Request時にビルドチェックを実行
  pull_request:
    branches:
      - main

  # データ更新ワークフロー完了後に実行
  workflow_run:
    workflows: ["Update Gym Schedule Data"]
    types:
      - completed
    branches:
      - main

  # 手動実行も可能にする
  workflow_dispatch:

# GitHub Pagesへのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: |
          echo "========== Building Site =========="
          npm run build
          echo "========== Build Complete =========="
          echo "📦 Output directory size: $(du -sh out | cut -f1)"
          echo "📄 Files generated: $(find out -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    # PRの場合はデプロイをスキップ（push, workflow_run, workflow_dispatch でデプロイ）
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
