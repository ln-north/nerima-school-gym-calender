name: Update Gym Schedule Data

on:
  # 1時間に1回実行
  schedule:
    - cron: '0 * * * *'  # 毎時0分に実行

  # 手動実行も可能にする
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraping script
        run: |
          echo "========== Starting Scraping =========="
          npm run scrape
          echo "========== Scraping Results =========="
          if [ -f public/data/schedule.json ]; then
            EVENTS_COUNT=$(grep -o '"id":' public/data/schedule.json | wc -l | tr -d ' ')
            SCHOOLS_COUNT=$(jq -r '[.events[].schoolName] | unique | length' public/data/schedule.json)
            SPORTS_COUNT=$(jq -r '[.events[].sports[]] | unique | length' public/data/schedule.json)
            echo "✓ Data file created successfully"
            echo "📊 Events: $EVENTS_COUNT"
            echo "🏫 Schools: $SCHOOLS_COUNT"
            echo "⚽ Sports: $SPORTS_COUNT"
            echo "📄 File size: $(du -h public/data/schedule.json | cut -f1)"
          else
            echo "❌ ERROR: Data file not created!"
            exit 1
          fi
        continue-on-error: false

      - name: Verify scraped data
        run: |
          echo "========== Verifying Scraped Data =========="
          npm run verify
        continue-on-error: false

      - name: Generate iCalendar files
        run: |
          echo "========== Generating iCalendar Files =========="
          npm run generate-ical
          echo "========== iCalendar Results =========="
          if [ -d public/ical ]; then
            ICAL_FILES=$(find public/ical -name "*.ics" | wc -l)
            echo "✓ Generated $ICAL_FILES iCalendar files"
            ls -lh public/ical/
          else
            echo "⚠️  Warning: iCalendar directory not created"
          fi
        continue-on-error: false

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code public/data/ public/ical/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/ public/ical/
          git commit -m "chore: update gym schedule data"
          git push
